#### This file contains tests to evaluate that the hotel chatbot behaves as expected.

stories:

# ------------------------------------------------------------
# PERSON 1 - ROOM BOOKING
# ------------------------------------------------------------

- story: book a room
  steps:
  - user: |
      I want to book a deluxe room
    intent: book_room
  - action: booking_form
  - active_loop: booking_form
  - user: |
      2
    intent: affirm
  - action: booking_form
  - active_loop: null
  - action: utter_booking_confirmation
  - action: action_reset_booking

# ------------------------------------------------------------
# PERSON 2 - ROOM CLEANING
# ------------------------------------------------------------

- story: request room cleaning
  steps:
  - user: |
      I need room cleaning
    intent: request_cleaning
  - action: cleaning_form
  - active_loop: cleaning_form

# ------------------------------------------------------------
# PERSON 2 - FAQ
# ------------------------------------------------------------

- story: ask check-in time
  steps:
  - user: |
      What time is check-in?
    intent: faq/ask_check_in
  - action: utter_faq

# ------------------------------------------------------------
# PERSON 3 - GREETINGS / FAREWELLS
# ------------------------------------------------------------

- story: greeting uses time based action
  steps:
  - user: |
      hello
    intent: greet
  - action: action_time_based_greeting

- story: farewell
  steps:
  - user: |
      goodbye
    intent: goodbye
  - action: utter_goodbye

# ------------------------------------------------------------
# PERSON 3 - GUEST FEEDBACK
# ------------------------------------------------------------

- story: give positive feedback directly
  steps:
  - user: |
      The room was excellent
    intent: give_feedback
  - action: feedback_form
  - active_loop: feedback_form
  - active_loop: null
  - action: action_analyze_feedback
  - action: action_reset_feedback

- story: say you want to give feedback then provide it
  steps:
  - user: |
      I want to give feedback
    intent: give_feedback
  - action: feedback_form
  - active_loop: feedback_form
  - user: |
      The service was terrible
    intent: give_feedback
  - action: feedback_form
  - active_loop: null
  - action: action_analyze_feedback
  - action: action_reset_feedback

version: "3.1"

rules:

# -----------------------------------------------
# Original rules
# -----------------------------------------------

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

# -----------------------------------------------
# Room Cleaning Form Rules
# -----------------------------------------------

- rule: Activate room cleaning form
  steps:
  - intent: request_room_cleaning
  - action: utter_cleaning_request_intro
  - action: room_cleaning_form
  - active_loop: room_cleaning_form

- rule: Submit room cleaning form
  condition:
  - active_loop: room_cleaning_form
  steps:
  - action: room_cleaning_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_submit_room_cleaning
  - action: utter_anything_else

- rule: Cancel room cleaning anytime
  steps:
  - intent: cancel_room_cleaning
  - action: action_cancel_room_cleaning
  - active_loop: null

# -----------------------------------------------
# FAQ Rules (deterministic - always trigger)
# -----------------------------------------------

- rule: Answer check-in time FAQ
  steps:
  - intent: faq_checkin_time
  - action: utter_faq_checkin_time
  - action: utter_anything_else


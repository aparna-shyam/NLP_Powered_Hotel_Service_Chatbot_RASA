version: "3.1"

stories:

- story: complete room booking
  steps:
    - intent: book_room
      entities:
        - room_type: deluxe
        - number_of_rooms: 2
    - action: booking_form
    - active_loop: booking_form
    - active_loop: null
    - action: utter_booking_confirmation
    - action: action_reset_booking


- story: room booking with missing information
  steps:
    - intent: book_room
    - action: booking_form
    - active_loop: booking_form
    - slot_was_set:
        - room_type: deluxe
    - slot_was_set:
        - number_of_rooms: 2
    - active_loop: null
    - action: utter_booking_confirmation
    - action: action_reset_booking


- story: complete room cleaning
  steps:
    - intent: request_cleaning
    - action: cleaning_form
    - active_loop: cleaning_form
    - active_loop: null
    - action: action_cleaning_confirmation
    - action: action_reset_cleaning